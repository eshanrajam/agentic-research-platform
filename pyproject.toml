[project]
name = "agentic-research-platform"
version = "0.1.0"
description = "Multi-agent AI research & coding assistant built with Microsoft Agent Framework, custom Model Context Protocol (MCP) tool servers, RAG, full observability, and one-command Azure deployment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]

dependencies = [
  # Scoped Agent Framework packages (not the `agent-framework` meta-package, which pulls in
  # dozens of unused provider extras - Redis, Gemini, Mistral, Hyperlight sandbox, etc. -
  # and makes pip's resolver painfully slow). `-openai` covers both OpenAI and Azure OpenAI.
  "agent-framework-core>=1.14.0",
  "agent-framework-openai>=1.13.0",
  "azure-identity>=1.19.0",
  "openai>=2.25.0,<3",
  "chromadb>=0.5.20",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "python-dotenv>=1.0.1",
  "mcp>=1.2.0",
  "pypdf>=5.0.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[project.optional-dependencies]
# Only needed if you configure FOUNDRY_PROJECT_ENDPOINT / FOUNDRY_MODEL in .env.
foundry = ["agent-framework-foundry>=1.14.0"]
azure-monitor = ["azure-monitor-opentelemetry-exporter>=1.0.0b30"]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.7.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
