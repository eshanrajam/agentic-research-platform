<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agentic Research Platform</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>🤖 Agentic Research Platform</h1>
      <p>Multi-agent orchestrator — Researcher · Coder · Analyst · Critic</p>
    </header>

    <main id="chat-log" aria-live="polite"></main>

    <form id="chat-form">
      <input
        id="chat-input"
        type="text"
        placeholder="Ask a research question, a coding question, or query your ingested docs…"
        autocomplete="off"
        required
      />
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
